name: Build Android APK
on:
  push:
    branches: [main, master]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Build
        run: gradle -p android assembleDebug --no-daemon
      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MathBoard.apk
      - uses: actions/upload-artifact@v4
        with: { name: MathBoard-apk, path: MathBoard.apk }
      - name: Publish release (постоянная ссылка на скачивание для учеников)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: MathBoard APK
          files: MathBoard.apk
